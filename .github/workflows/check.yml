name: Пошук квартир

on:
  schedule:
    - cron: "*/5 * * * *"   # кожні 5 хвилин
  workflow_dispatch:         # кнопка «Run workflow» для ручного запуску

permissions:
  contents: write

concurrency:
  group: rent-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python rent_bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Зберегти список уже надісланих оголошень
        run: |
          git config user.name "rent-bot"
          git config user.email "rent-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen" && git push)
